name: Build mrpack

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dependencies
        run: python3 scripts/check-deps.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Verify index is up to date
        run: |
          packwiz refresh
          if ! git diff --quiet index.toml pack.toml; then
            echo "::error::index.toml 与内容不一致，请本地执行 packwiz refresh 后提交"
            git diff --stat
            exit 1
          fi

      - name: Export mrpack
        run: |
          mkdir -p dist
          packwiz modrinth export -o dist/CreateNookLite.mrpack

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version' pack.toml | sed 's/.*= *"//; s/"//')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreateNookLite-${{ steps.version.outputs.version }}
          path: dist/CreateNookLite.mrpack

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CreateNookLite.mrpack
