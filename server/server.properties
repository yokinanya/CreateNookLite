# Create Nook Lite — 服务端配置模板
# 适用于 MC 1.20.1 / Forge 47.4.16 / 低功耗 CPU（实测于 i5-1235U）
# 说明见同目录 README.md

# ---------- 世界 ----------
level-name=world
level-type=minecraft\:normal
level-seed=
allow-nether=true
generate-structures=true
spawn-protection=0
max-world-size=29999984

# ---------- 性能 ----------
# 视距是 TPS 头号杀手，2P 核 CPU 上不要超过 8
view-distance=7
simulation-distance=5
entity-broadcast-range-percentage=70
sync-chunk-writes=false
# -1 表示不因单 tick 超时崩服，模组服必备
max-tick-time=-1
use-native-transport=true
max-chained-neighbor-updates=1000000
network-compression-threshold=256
rate-limit=0

# ---------- 游戏性 ----------
difficulty=normal
gamemode=survival
force-gamemode=false
hardcore=false
pvp=true
max-players=10
player-idle-timeout=0
enable-command-block=true
# 必须开：Create Jetpack 和悬浮背包会被反作弊误判为飞行
allow-flight=true
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
op-permission-level=4
function-permission-level=2

# ---------- 正版与白名单 ----------
# 正版服：两项一起开。离线服：两项一起关。混搭会导致聊天签名异常
online-mode=true
enforce-secure-profile=true
white-list=true
enforce-whitelist=true
prevent-proxy-connections=false
enable-status=true
hide-online-players=false

# ---------- 网络 ----------
server-ip=
server-port=25565

# ---------- RCON ----------
# 开启后请设置强密码，只监听本机回环
enable-rcon=false
rcon.port=25575
rcon.password=
broadcast-rcon-to-ops=true

# ---------- 其它 ----------
enable-query=false
enable-jmx-monitoring=false
broadcast-console-to-ops=true
require-resource-pack=false
motd=\u00a7bCreate Nook Lite \u00a77| \u00a7f1.20.1
